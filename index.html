<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../script/main.js" defer></script>

    <title>Парсер</title>
</head>
<body>
    <main class="container">
        <section class="parse-form">
            <div class="parse-form__title">
                <h2>Прикрепите файл формата JSON</h2>
                <input type="file" class="parse-form__input" placeholder="Прикрепить файл">
                <button class="parse-form__button-attach">Прикрепить</button>
                <button class="parse-form__button-throw">Сбросить</button>
            </div>
            <div class="parse-form__final"></div>
            <button class="delete">Удалить</button>
        </section>
    </main>
</body>
</html>
