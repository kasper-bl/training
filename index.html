<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>инстаботы</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <header class="padding">
                <div class="header_main">
                    <p class="logo">инстаботы</p>
                    <div class="header_nav">
                        <nav>
                        <a href="#">О компании</a>
                        <a href="#">Тарифы</a>
                        <a href="#">Отзывы</a>
                        <a href="#">Q&A</a>
                        <a href="#">Обратная связь</a>
                        </nav>
                        <div class="header_controls">
                            <div class="language">
                                <p>Ru</p>
                                <p>/</p>
                                <p>En</p>
                            </div>
                            <a href="#" class="button">Вход и регистрация</a>
                        </div>
                    </div>
                    
                    
                </div>
            </header>
                <section class="main_banner">
                    <div class="main_banner_container padding">
                        <div class="main_banner_text">
                            <h1>
                                Высокий уровень вовлечения представителей
                            </h1>
        
                            <div class="email_form">
                                <input type="email" class="email_input" placeholder="Введите свой e-mail">
                                <button type="submit" class="submit_button">Отправить</button>
                            </div>
                            <p>Нажимая на кнопку вы соглашаетесь на обработку<br> <a href="#">персональных данных</a></p>
                            <div class="mouse">
                                <img src="./assets/img/Wheeldown.svg" alt="Wheeldown">
                                <p>Листайте дальше</p>
                            </div>
                        </div>
                        <div class="main_img">
                            <img src="./assets/img/main_banner.svg" alt="main_banner">
                        </div>
                    </div>
                </section>
        </div>
    </div>
    
    
    
</body>
</html>
